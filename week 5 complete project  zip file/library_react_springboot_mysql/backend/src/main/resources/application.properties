spring.application.name=library-api
server.port=8080

# MySQL database created/tested with MySQL Workbench
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/library_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

app.jwt.secret=${JWT_SECRET:CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_32_CHARS_MINIMUM}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Optional embedding provider. If configured, the returned vector is used for
# semantic ranking in the application layer because this MySQL version stores
# embeddings as JSON/TEXT rather than using PostgreSQL pgvector.
app.embedding.url=${EMBEDDING_URL:https://api.openai.com/v1/embeddings}
app.embedding.model=${EMBEDDING_MODEL:text-embedding-3-small}
app.embedding.api-key=${EMBEDDING_API_KEY:}

app.audit.file=${AUDIT_FILE:logs/book_events.txt}
